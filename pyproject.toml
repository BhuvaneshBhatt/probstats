[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "probstats"
dynamic = ["version"]
description = "Probability and statistics for Python with exact and approximate inference, Bayesian methods, algebraic statistics, survival analysis, random matrices, and labeled-data support."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{name = "Bhuvanesh Bhatt"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.24", "sympy>=1.12", "exprtest>=0.1.0"]

[project.urls]
Repository = "https://github.com/BhuvaneshBhatt/probstats"
Issues = "https://github.com/BhuvaneshBhatt/probstats/issues"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "scipy>=1.10", "exprtest>=0.1.0", "multiple-integrate>=2.1.0", "semialg>=1.2.0", "tensoratlas>=0.2.0", "funcprops>=0.2.0"]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.6", "scipy>=1.10", "exprtest>=0.1.0", "multiple-integrate>=2.1.0", "semialg>=1.2.0", "tensoratlas>=0.2.0", "funcprops>=0.2.0"]
laplace = ["scipy>=1.10"]
symbopt = ["symbopt>=0.1.0"]
asymptotic = ["asymptotic>=0.1.0"]
exact = ["multiple-integrate>=2.1.0", "exprtest>=0.1.0", "semialg>=1.2.0"]
certify = ["exprtest>=0.1.0", "semialg>=1.2.0"]
reasoning = ["semialg>=1.2.0", "funcprops>=0.2.0"]
algebraic = ["semialg>=1.2.0"]
tensor = ["tensoratlas>=0.2.0"]
algebraic-tensor = ["semialg>=1.2.0", "tensoratlas>=0.2.0"]
arviz = ["arviz>=0.18"]
tabular = ["pandas>=2.0"]
jax = ["jax>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
ignore = ["PLE0604"]

[tool.ruff.lint.per-file-ignores]
"src/probstats/bayes/__init__.py" = ["F401"]
"tests/test_documentation_contracts.py" = ["S102"]

[tool.setuptools.dynamic]
version = {attr = "probstats._version.__version__"}
